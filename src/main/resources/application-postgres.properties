# Perfil "postgres": usa la base de datos real en lugar de H2.
# Ejecutar con:  mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# La clave se toma de la variable de entorno DB_PASSWORD (por defecto "postgres").
spring.datasource.url=jdbc:postgresql://localhost:5432/hakan_burger
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
