spring.application.name=hakan-backend
server.port=8080

# Base de datos H2 en memoria: no hay que instalar nada. Los datos de prueba se cargan
# al iniciar (config/DatosIniciales.java) y se borran al detener la aplicacion.
# Para usar PostgreSQL, ejecutar con el perfil "postgres" (ver application-postgres.properties).
spring.datasource.url=jdbc:h2:mem:hakan_burger;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Consola para ver las tablas: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:hakan_burger, usuario: sa)
spring.h2.console.enabled=true

spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# No enviar los campos vacios (null) en el JSON, igual que los datos de prueba del frontend
spring.jackson.default-property-inclusion=non_null

# Direcciones desde las que el frontend puede llamar a la API (separadas por coma)
app.cors.origenes=http://localhost:5173,http://127.0.0.1:5173
